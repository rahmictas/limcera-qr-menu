<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limcera Menü Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

  <!-- GİRİŞ EKRANI -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm border border-stone-200">
      <h1 class="text-xl font-bold text-stone-900 mb-1">Limcera Admin</h1>
      <p class="text-xs text-stone-500 mb-5">Menü ve görsel yönetimi için giriş yapın</p>
      <form id="loginForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">E-posta</label>
          <input type="email" id="email" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:border-amber-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Şifre</label>
          <input type="password" id="password" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:border-amber-500" />
        </div>
        <button type="submit" class="w-full bg-stone-900 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-stone-800 transition">Giriş Yap</button>
      </form>
      <p id="loginError" class="text-xs text-red-600 mt-3 hidden"></p>
    </div>
  </div>

  <!-- YÖNETİM PANELİ -->
  <div id="adminSection" class="hidden pb-16">
    <header class="bg-white border-b border-stone-200 sticky top-0 z-20">
      <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h1 class="font-bold text-stone-900">Trabzon Limcera • Menü Yönetimi</h1>
          <p class="text-xs text-stone-500" id="userEmail"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <label id="logoUploadLabel" class="cursor-pointer bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-purple-700 transition flex items-center gap-1.5">
            <span>🖼️ Logo Yükle</span>
            <input type="file" accept="image/*" class="hidden" onchange="uploadSiteLogo(event)" />
          </label>
          <label class="cursor-pointer bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 transition flex items-center gap-1.5">
            <span>📄 Rapor Yükle (.html)</span>
            <input type="file" id="reportFileInput" accept=".html,.htm" class="hidden" onchange="handleReportUpload(event)" />
          </label>
          <button onclick="openNewModal()" class="bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-amber-700">+ Yeni Ürün</button>
          <button onclick="logout()" class="bg-stone-200 text-stone-700 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-stone-300">Çıkış</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-5">
      <!-- Filtre -->
      <div class="flex flex-col sm:flex-row gap-3 mb-5">
        <input type="text" id="adminSearch" placeholder="Ürün adı veya kodu ile filtrele..." oninput="renderAdminList()"
          class="flex-1 bg-white px-3.5 py-2 rounded-xl border border-stone-200 text-sm outline-none focus:border-amber-500" />
        <select id="adminCatFilter" onchange="renderAdminList()" class="bg-white px-3.5 py-2 rounded-xl border border-stone-200 text-sm outline-none">
          <option value="TÜMÜ">Tüm Kategoriler</option>
        </select>
      </div>

      <!-- Ürün Kartları -->
      <div id="adminList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>
  </div>

  <!-- YENİ ÜRÜN EKLEME PENCERESİ -->
  <div id="newModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 w-full max-w-md">
      <h2 class="font-bold text-base mb-4">Yeni Ürün Ekle</h2>
      <form id="newProductForm" class="space-y-3">
        <input type="text" id="newCode" placeholder="Ürün Kodu (Örn: 153.196 - İsteğe bağlı)" class="w-full px-3 py-2 border rounded-xl text-sm" />
        <input type="text" id="newCat" placeholder="Kategori (Örn: TATLI)" required class="w-full px-3 py-2 border rounded-xl text-sm uppercase" />
        <input type="text" id="newName" placeholder="Ürün Adı" required class="w-full px-3 py-2 border rounded-xl text-sm" />
        <input type="text" id="newDesc" placeholder="Açıklama (İsteğe bağlı)" class="w-full px-3 py-2 border rounded-xl text-sm" />
        <input type="number" step="0.01" id="newPrice" placeholder="Fiyat (KDV Dahil TL)" required class="w-full px-3 py-2 border rounded-xl text-sm" />
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeNewModal()" class="px-4 py-2 text-xs font-semibold text-stone-600">İptal</button>
          <button type="submit" class="px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-semibold">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOPLU FİYAT GÜNCELLEME ÖNİZLEME PENCERESİ -->
  <div id="bulkModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
      <div class="p-4 border-b border-stone-200 flex items-center justify-between bg-stone-50">
        <div>
          <h2 class="font-bold text-base text-stone-900">Toplu Fiyat Güncelleme Önizlemesi</h2>
          <p id="bulkSummary" class="text-xs text-stone-500 mt-0.5"></p>
        </div>
        <button onclick="closeBulkModal()" class="text-stone-400 hover:text-stone-700 text-lg font-bold px-2">✕</button>
      </div>

      <div class="px-4 py-2.5 bg-amber-50/70 border-b border-amber-100 flex flex-wrap items-center justify-between gap-3 text-xs">
        <label class="flex items-center gap-2 font-medium text-stone-700 cursor-pointer">
          <input type="checkbox" id="includeVatCheckbox" checked onchange="recalculateBulkPrices()" class="rounded text-amber-600" />
          <span>KDV ekle (%10 / %20)</span>
        </label>
        <div class="flex items-center gap-2">
          <span class="font-medium text-stone-700">Yuvarlama:</span>
          <select id="roundingModeSelect" onchange="recalculateBulkPrices()" class="bg-white border border-stone-300 rounded-lg px-2 py-1 text-xs font-semibold text-stone-800 outline-none">
            <option value="1" selected>En yakın 1 TL</option>
            <option value="5">En yakın 5 TL</option>
            <option value="0.5">En yakın 0,50 TL</option>
            <option value="none">Yuvarlama Yok (Kuruşlu)</option>
          </select>
        </div>
      </div>

      <div id="bulkPreviewBody" class="p-4 overflow-y-auto flex-1 space-y-5"></div>

      <div class="p-4 border-t border-stone-200 bg-stone-50 flex items-center justify-between gap-3">
        <span id="bulkProgress" class="text-xs font-semibold text-blue-700"></span>
        <div class="flex gap-2">
          <button type="button" onclick="closeBulkModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-stone-600 hover:bg-stone-200">İptal</button>
          <button type="button" id="applyBulkBtn" onclick="applyBulkUpdates()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 transition">
            Seçili Güncellemeleri Uygula
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // BURAYA MEVCUT SUPABASE ANON KEY BİLGİNİZİ YAPIŞTIRIN
    const SUPABASE_URL = 'https://pmhqpdrhlyncwsyehuvl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtaHFwZHJobHluY3dzeWVodXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MTY3NTMsImV4cCI6MjExMTE5Mjc1M30.uJRs7wr232jW0sYVQUuXGkCeLcYFOqvBE5po7VyYpjs';
    const BUCKET_NAME = 'menu-gorselleri';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let parsedReportRows = [];
    let bulkChanges = [];
    let bulkNewItems = [];

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        document.getElementById('userEmail').textContent = session.user.email;
        loadProducts();
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        const errEl = document.getElementById('loginError');
        errEl.textContent = 'Giriş başarısız: ' + error.message;
        errEl.classList.remove('hidden');
      } else {
        checkSession();
      }
    });

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function loadProducts() {
      const { data, error } = await sb.from('urunler').select('*').order('kategori').order('id');
      if (!error) {
        products = data || [];
        const cats = [...new Set(products.map(p => p.kategori))];
        const featuredCount = products.filter(p => p.onerilen_mi).length;
        const select = document.getElementById('adminCatFilter');
        select.innerHTML = `
          <option value="TÜMÜ">Tüm Kategoriler (${products.length})</option>
          <option value="ONERILENLER">★ Önerilen Ürünler (${featuredCount})</option>
          ${cats.map(c => `<option value="${c}">${c}</option>`).join('')}
        `;
        renderAdminList();
      }
    }

    function renderAdminList() {
      const q = document.getElementById('adminSearch').value.toLowerCase();
      const cat = document.getElementById('adminCatFilter').value;
      const filtered = products.filter(p => {
        const matchesCat =
          cat === 'TÜMÜ' ? true :
          cat === 'ONERILENLER' ? p.onerilen_mi === true :
          p.kategori === cat;
        const matchesQuery = p.ad.toLowerCase().includes(q) || (p.urun_kodu && p.urun_kodu.toLowerCase().includes(q));
        return matchesCat && matchesQuery;
      });

      document.getElementById('adminList').innerHTML = filtered.map(p => `
        <div class="bg-white p-4 rounded-2xl border ${p.aktif_mi ? 'border-stone-200' : 'border-red-200 bg-red-50/30'} shadow-sm flex gap-4">
          <div class="w-24 flex-shrink-0 flex flex-col items-center gap-2">
            <div class="w-24 h-24 rounded-xl bg-stone-100 overflow-hidden border border-stone-200 flex items-center justify-center relative">
              ${p.gorsel_url 
                ? `<img id="img-${p.id}" src="${p.gorsel_url}" class="w-full h-full object-cover" />` 
                : `<span id="img-${p.id}" class="text-[10px] text-stone-400">Görsel Yok</span>`
              }
            </div>
            <label class="w-full text-center cursor-pointer bg-stone-900 text-white text-[11px] font-medium py-1.5 px-2 rounded-lg hover:bg-stone-700 transition">
              Fotoğraf Seç
              <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, ${p.id})" />
            </label>
          </div>

          <div class="flex-1 space-y-2 min-w-0">
            <div class="flex flex-wrap items-center justify-between gap-1.5">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded truncate">${p.kategori}</span>
              </div>
              <div class="flex items-center gap-2.5 text-xs">
                <label class="flex items-center gap-1 cursor-pointer font-medium text-amber-700">
                  <input type="checkbox" ${p.onerilen_mi ? 'checked' : ''} onchange="toggleFeatured(${p.id}, this.checked)" class="rounded text-amber-500" />
                  <span>★ Önerilen</span>
                </label>
                <label class="flex items-center gap-1 cursor-pointer">
                  <input type="checkbox" ${p.aktif_mi ? 'checked' : ''} onchange="toggleActive(${p.id}, this.checked)" class="rounded text-emerald-600" />
                  <span>${p.aktif_mi ? 'Yayında' : 'Gizli'}</span>
                </label>
              </div>
            </div>
            
            <input type="text" id="name-${p.id}" value="${p.ad}" class="w-full font-semibold text-sm border-b border-transparent focus:border-stone-300 outline-none py-0.5" />
            <input type="text" id="desc-${p.id}" value="${p.aciklama || ''}" placeholder="Açıklama ekle..." class="w-full text-xs text-stone-500 border-b border-transparent focus:border-stone-300 outline-none py-0.5" />
            
            <div class="flex items-center justify-between pt-1">
              <div class="flex items-center gap-1">
                <input type="number" step="0.01" id="price-${p.id}" value="${p.fiyat}" class="w-24 px-2 py-1 border rounded-lg text-sm font-bold text-stone-900" />
                <span class="text-xs font-semibold">₺</span>
              </div>
              <button onclick="saveProduct(${p.id})" id="btn-${p.id}" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-700 transition">
                Kaydet
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function compressImageToWebP(file, maxWidth = 1000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onerror = () => resolve(file);
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => resolve(file);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scaleSize = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => resolve(blob || file), 'image/webp', 0.88);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function processTransparentLogoPNG(file, maxWidth = 400) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onerror = () => resolve(file);
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => resolve(file);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scaleSize = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => resolve(blob || file), 'image/png');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadSiteLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const label = document.getElementById('logoUploadLabel');
      const originalHtml = label.innerHTML;
      label.innerHTML = '<span>Yükleniyor...</span>';

      const pngBlob = await processTransparentLogoPNG(file, 400);
      const { error } = await sb.storage
        .from(BUCKET_NAME)
        .upload('site-logo.png', pngBlob, {
          contentType: 'image/png',
          cacheControl: '60',
          upsert: true
        });

      label.innerHTML = originalHtml;
      event.target.value = '';

      if (error) {
        alert('Logo yüklenemedi: ' + error.message);
      } else {
        alert('Şeffaf PNG logo başarıyla yüklendi! Ana sayfayı yenilediğinizde sol üstte yuvarlak olarak görünecektir.');
      }
    }

    async function uploadImage(event, productId) {
      const file = event.target.files[0];
      if (!file) return;

      const btn = document.getElementById(`btn-${productId}`);
      btn.textContent = 'Yükleniyor...';

      const webpBlob = await compressImageToWebP(file, 1000);
      const isWebp = webpBlob.type === 'image/webp';
      const fileName = `urun-${productId}-${Date.now()}.${isWebp ? 'webp' : 'jpg'}`;

      const { error: uploadError } = await sb.storage
        .from(BUCKET_NAME)
        .upload(fileName, webpBlob, {
          contentType: webpBlob.type || 'image/webp',
          upsert: true
        });

      if (uploadError) {
        alert('Fotoğraf yüklenemedi: ' + uploadError.message);
        btn.textContent = 'Kaydet';
        return;
      }

      const { data: { publicUrl } } = sb.storage.from(BUCKET_NAME).getPublicUrl(fileName);
      await sb.from('urunler').update({ gorsel_url: publicUrl }).eq('id', productId);
      btn.textContent = 'Kaydet';
      loadProducts();
    }

    async function saveProduct(id) {
      const btn = document.getElementById(`btn-${id}`);
      btn.textContent = '...';
      const ad = document.getElementById(`name-${id}`).value;
      const aciklama = document.getElementById(`desc-${id}`).value;
      const fiyat = parseFloat(document.getElementById(`price-${id}`).value);

      const { error } = await sb.from('urunler').update({ ad, aciklama, fiyat }).eq('id', id);
      if (error) alert('Hata: ' + error.message);
      else {
        btn.textContent = 'Kaydedildi ✓';
        setTimeout(() => btn.textContent = 'Kaydet', 1500);
      }
    }

    async function toggleActive(id, status) {
      await sb.from('urunler').update({ aktif_mi: status }).eq('id', id);
      loadProducts();
    }

    async function toggleFeatured(id, status) {
      const { error } = await sb.from('urunler').update({ onerilen_mi: status }).eq('id', id);
      if (error) {
        alert('Önerilen durumu güncellenemedi (SQL kodunu çalıştırdığınızdan emin olun): ' + error.message);
      }
      loadProducts();
    }

    function openNewModal() { document.getElementById('newModal').classList.replace('hidden', 'flex'); }
    function closeNewModal() { document.getElementById('newModal').classList.replace('flex', 'hidden'); }

    document.getElementById('newProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const urun_kodu = document.getElementById('newCode').value.trim() || null;
      const kategori = document.getElementById('newCat').value.toUpperCase().trim();
      const ad = document.getElementById('newName').value.trim();
      const aciklama = document.getElementById('newDesc').value.trim();
      const fiyat = parseFloat(document.getElementById('newPrice').value);

      const { error } = await sb.from('urunler').insert([{ urun_kodu, kategori, ad, aciklama, fiyat, aktif_mi: true, onerilen_mi: false }]);
      if (!error) {
        closeNewModal();
        e.target.reset();
        loadProducts();
      } else {
        alert('Hata: ' + error.message);
      }
    });

    // --- HTML RAPOR OKUMA VE TOPLU FİYAT GÜNCELLEME ---
    function cleanCellText(cell) {
      return cell ? cell.textContent.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim() : '';
    }

    function parseSmartNumber(str) {
      if (!str) return NaN;
      let s = str.replace(/[^\d.,-]/g, '').trim();
      if (!s) return NaN;
      const lastComma = s.lastIndexOf(',');
      const lastDot = s.lastIndexOf('.');
      if (lastComma > lastDot) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else {
        s = s.replace(/,/g, '');
      }
      return parseFloat(s);
    }

    function applyRounding(value, mode) {
      if (mode === '1') return Math.round(value);
      if (mode === '5') return Math.round(value / 5) * 5;
      if (mode === '0.5') return Math.round(value * 2) / 2;
      return Number(value.toFixed(2));
    }

    function handleReportUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(e.target.result, 'text/html');
        const rows = Array.from(doc.querySelectorAll('tr'));

        let colCode = 1, colName = 2, colCat = 4, colPrice = 23, colVat = 27;
        let headerFound = false;

        for (const row of rows) {
          const cells = Array.from(row.querySelectorAll('td, th')).map(cleanCellText);
          const idxName = cells.findIndex(c => c.toLowerCase().includes('ürün adı'));
          const idxPrice = cells.findIndex(c => c.toLowerCase().includes('satış fiyatı1'));
          if (idxName !== -1 && idxPrice !== -1) {
            const idxCode = cells.findIndex(c => c.toLowerCase().includes('ürün kodu'));
            const idxCat = cells.findIndex(c => c.toLowerCase() === 'ana grup' || c.toLowerCase() === 'grup');
            const idxVat = cells.findIndex(c => c.toLowerCase().includes('satış kdv'));
            if (idxCode !== -1) colCode = idxCode;
            colName = idxName;
            if (idxCat !== -1) colCat = idxCat;
            colPrice = idxPrice;
            if (idxVat !== -1) colVat = idxVat;
            headerFound = true;
            break;
          }
        }

        if (!headerFound) {
          alert('Yüklenen HTML dosyasında Webticari ürün listesi tablosu bulunamadı.');
          event.target.value = '';
          return;
        }

        parsedReportRows = [];
        for (const row of rows) {
          const cells = Array.from(row.querySelectorAll('td'));
          if (cells.length <= colPrice) continue;

          const code = cleanCellText(cells[colCode]);
          const name = cleanCellText(cells[colName]);
          const cat = cleanCellText(cells[colCat]) || 'DİĞER';

          if (!name || name === 'Ürün Adı' || code.startsWith('ÖZEL')) continue;
          const rawPrice = parseSmartNumber(cleanCellText(cells[colPrice]));
          if (isNaN(rawPrice) || rawPrice <= 0) continue;

          const parsedVat = parseSmartNumber(cleanCellText(cells[colVat]));
          const vat = isNaN(parsedVat) ? 10 : parsedVat;
          parsedReportRows.push({ code, name, cat, rawPrice, vat });
        }

        event.target.value = '';
        recalculateBulkPrices();
        document.getElementById('bulkModal').classList.replace('hidden', 'flex');
      };
      reader.readAsText(file, 'UTF-8');
    }

    function recalculateBulkPrices() {
      const addVat = document.getElementById('includeVatCheckbox').checked;
      const roundingMode = document.getElementById('roundingModeSelect').value;
      bulkChanges = [];
      bulkNewItems = [];
      let unchangedCount = 0;

      const byCode = new Map();
      const byName = new Map();
      products.forEach(p => {
        if (p.urun_kodu) byCode.set(p.urun_kodu.trim().toUpperCase(), p);
        byName.set(p.ad.trim().toLocaleUpperCase('tr-TR'), p);
      });

      const seenDbIds = new Set();

      for (const item of parsedReportRows) {
        const rawWithVat = addVat ? item.rawPrice * (1 + item.vat / 100) : item.rawPrice;
        const finalPrice = applyRounding(rawWithVat, roundingMode);

        const matched = (item.code && byCode.get(item.code.toUpperCase())) || 
                        byName.get(item.name.toLocaleUpperCase('tr-TR'));

        if (matched) {
          if (seenDbIds.has(matched.id)) continue;
          seenDbIds.add(matched.id);

          if (Number(matched.fiyat) !== finalPrice) {
            bulkChanges.push({
              id: matched.id,
              code: matched.urun_kodu || item.code,
              name: matched.ad,
              oldPrice: Number(matched.fiyat),
              newPrice: finalPrice,
              selected: true
            });
          } else {
            unchangedCount++;
          }
        } else {
          bulkNewItems.push({
            code: item.code,
            cat: item.cat.toLocaleUpperCase('tr-TR'),
            name: item.name,
            newPrice: finalPrice,
            selected: false
          });
        }
      }

      document.getElementById('bulkSummary').textContent = 
        `${parsedReportRows.length} ürün okundu • ${bulkChanges.length} fiyat değişikliği • ${unchangedCount} ürün aynı • ${bulkNewItems.length} yeni kayıt`;

      renderBulkPreview();
    }

    function renderBulkPreview() {
      const container = document.getElementById('bulkPreviewBody');
      let html = '';

      if (bulkChanges.length === 0) {
        html += `<div class="text-center py-6 bg-stone-50 rounded-xl text-sm text-stone-500">Mevcut ürünlerin tamamının fiyatı rapordaki tutarlarla aynı.</div>`;
      } else {
        html += `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">Fiyatı Güncellenecek Ürünler (${bulkChanges.length})</h3>
            <div class="border border-stone-200 rounded-xl overflow-hidden">
              <table class="w-full text-left text-xs">
                <thead class="bg-stone-100 text-stone-600 font-semibold">
                  <tr>
                    <th class="p-2.5 w-8"><input type="checkbox" checked onchange="toggleAllBulkChanges(this.checked)" /></th>
                    <th class="p-2.5">Ürün</th>
                    <th class="p-2.5 text-right">Eski Fiyat</th>
                    <th class="p-2.5 text-right">Yeni Fiyat (₺)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-stone-100">
                  ${bulkChanges.map((c, idx) => `
                    <tr class="hover:bg-stone-50">
                      <td class="p-2.5"><input type="checkbox" ${c.selected ? 'checked' : ''} onchange="bulkChanges[${idx}].selected = this.checked" /></td>
                      <td class="p-2.5">
                        <div class="font-semibold text-stone-900">${c.name}</div>
                        <div class="text-[10px] text-stone-400">${c.code || ''}</div>
                      </td>
                      <td class="p-2.5 text-right text-stone-400 line-through">${c.oldPrice} ₺</td>
                      <td class="p-2.5 text-right">
                        <input type="number" step="0.01" value="${c.newPrice}" onchange="bulkChanges[${idx}].newPrice = parseFloat(this.value)"
                          class="w-20 px-2 py-1 border rounded-lg text-right font-bold text-emerald-700" />
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (bulkNewItems.length > 0) {
        html += `
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-amber-700 mb-2">Menüde Olmayan Yeni Ürünler (${bulkNewItems.length}) — İsterseniz Seçip Ekleyin</h3>
            <div class="border border-amber-200 rounded-xl overflow-hidden">
              <table class="w-full text-left text-xs">
                <thead class="bg-amber-50 text-amber-900 font-semibold">
                  <tr>
                    <th class="p-2.5 w-8">Ekle</th>
                    <th class="p-2.5">Kategori / Ürün</th>
                    <th class="p-2.5 text-right">Fiyat</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-amber-100">
                  ${bulkNewItems.map((n, idx) => `
                    <tr>
                      <td class="p-2.5"><input type="checkbox" ${n.selected ? 'checked' : ''} onchange="bulkNewItems[${idx}].selected = this.checked" /></td>
                      <td class="p-2.5">
                        <span class="text-[10px] font-bold text-amber-700 mr-1">[${n.cat}]</span>
                        <span class="font-medium text-stone-800">${n.name}</span>
                      </td>
                      <td class="p-2.5 text-right font-bold">${n.newPrice} ₺</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function toggleAllBulkChanges(checked) {
      bulkChanges.forEach(c => c.selected = checked);
      renderBulkPreview();
    }

    function closeBulkModal() {
      document.getElementById('bulkModal').classList.replace('flex', 'hidden');
      document.getElementById('bulkProgress').textContent = '';
    }

    async function applyBulkUpdates() {
      const toUpdate = bulkChanges.filter(c => c.selected && !isNaN(c.newPrice));
      const toInsert = bulkNewItems.filter(n => n.selected && !isNaN(n.newPrice));

      if (toUpdate.length === 0 && toInsert.length === 0) {
        alert('Güncellenecek veya eklenecek seçili ürün bulunmuyor.');
        return;
      }

      const btn = document.getElementById('applyBulkBtn');
      const progress = document.getElementById('bulkProgress');
      btn.disabled = true;

      for (let i = 0; i < toUpdate.length; i += 20) {
        const chunk = toUpdate.slice(i, i + 20);
        progress.textContent = `Fiyatlar güncelleniyor (${Math.min(i + 20, toUpdate.length)}/${toUpdate.length})...`;
        await Promise.all(
          chunk.map(item => sb.from('urunler').update({ fiyat: item.newPrice }).eq('id', item.id))
        );
      }

      if (toInsert.length > 0) {
        progress.textContent = 'Yeni ürünler ekleniyor...';
        await sb.from('urunler').insert(
          toInsert.map(n => ({
            urun_kodu: n.code || null,
            kategori: n.cat,
            ad: n.name,
            fiyat: n.newPrice,
            aktif_mi: true,
            onerilen_mi: false
          }))
        );
      }

      btn.disabled = false;
      closeBulkModal();
      await loadProducts();
      alert(`İşlem tamamlandı! ${toUpdate.length} ürünün fiyatı güncellendi${toInsert.length ? `, ${toInsert.length} yeni ürün eklendi` : ''}.`);
    }

    checkSession();
  </script>
</body>
</html>
