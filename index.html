<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabzon Limcera | Dijital Menü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    if (
      localStorage.getItem('limcera-theme') === 'dark' ||
      (!localStorage.getItem('limcera-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-800 dark:text-stone-100 font-sans antialiased pb-14 transition-colors duration-200">

  <!-- ANA MENÜ GÖRÜNÜMÜ -->
  <div id="menuView">
    <!-- Üst Başlık, Yuvarlak Şeffaf Logo ve Arama -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-stone-900/95 backdrop-blur border-b border-stone-200 dark:border-stone-800 shadow-sm transition-colors">
      <div class="max-w-3xl mx-auto px-4 pt-3.5 pb-3">
        <div class="flex items-center justify-between mb-3 gap-2">
          <!-- Sol Üst Yuvarlak Logo ve İşletme Adı -->
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 overflow-hidden border border-stone-200/80 dark:border-stone-700/80 shadow-sm">
              <img id="siteLogoImg"
                src="https://pmhqpdrhlyncwsyehuvl.supabase.co/storage/v1/object/public/menu-gorselleri/site-logo.png"
                alt="Trabzon Limcera Logo"
                onerror="this.style.display='none'; const fb=document.getElementById('siteLogoFallback'); fb.classList.remove('hidden'); fb.classList.add('flex');"
                class="w-full h-full object-contain" />
              <span id="siteLogoFallback" class="hidden w-full h-full items-center justify-center bg-stone-900 dark:bg-amber-500 text-white dark:text-stone-950 font-extrabold text-base tracking-tighter">TL</span>
            </div>
            <div class="min-w-0">
              <h1 class="text-lg sm:text-xl font-bold tracking-tight text-stone-900 dark:text-white truncate">TRABZON LİMCERA</h1>
              <p class="text-xs text-stone-500 dark:text-stone-400 truncate">Hoş Geldiniz • Dijital Menü</p>
            </div>
          </div>

          <!-- Sağ Üst KDV Rozeti ve Karanlık Mod Butonu -->
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="hidden sm:inline-block text-xs font-medium bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 px-2.5 py-1 rounded-full">
              KDV Dahildir
            </span>
            <button onclick="toggleTheme()" aria-label="Tema Değiştir"
              class="p-2 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-amber-400 hover:bg-stone-200 dark:hover:bg-stone-700 transition">
              <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
              <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Türkçe Uyumlu Arama Kutusu -->
        <div class="relative mb-3">
          <input type="text" id="searchInput" placeholder="Ürün veya lezzet ara..."
            class="w-full pl-9 pr-4 py-2 bg-stone-100 dark:bg-stone-800 border border-transparent focus:border-amber-500 focus:bg-white dark:focus:bg-stone-900 rounded-xl text-sm text-stone-900 dark:text-stone-100 placeholder-stone-400 outline-none transition" />
          <svg class="w-4 h-4 text-stone-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Kategori Sekmeleri -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
      </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="max-w-3xl mx-auto px-4 pt-4">
      <!-- Karşılama Kapak Görseli (Banner) -->
      <section id="heroBannerSection" class="mb-6">
        <div class="w-full rounded-2xl sm:rounded-3xl overflow-hidden shadow-md border border-stone-200/80 dark:border-stone-800 bg-emerald-950">
          <img id="siteBannerImg"
            src="https://pmhqpdrhlyncwsyehuvl.supabase.co/storage/v1/object/public/menu-gorselleri/site-banner.webp"
            alt="Limcera ile Kahvenin Kalbinde Güne Enerjiyle Başla"
            onerror="document.getElementById('heroBannerSection').dataset.missing='true'; document.getElementById('heroBannerSection').classList.add('hidden');"
            class="w-full h-auto block" />
        </div>
      </section>

      <div id="loading" class="text-center py-12 text-stone-500 dark:text-stone-400 text-sm">Menü yükleniyor...</div>

      <!-- Yatay Kaydırılabilir Önerilen Ürünler Şeridi -->
      <section id="featuredSection" class="hidden mb-7">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-1.5">
            <span class="text-amber-500 text-base">★</span>
            <h2 class="text-sm font-bold uppercase tracking-wider text-stone-900 dark:text-stone-100">Önerilen Lezzetler</h2>
          </div>
          <div class="hidden sm:flex items-center gap-1">
            <button onclick="scrollFeatured(-220)" aria-label="Sola Kaydır"
              class="p-1 rounded-lg bg-stone-200/70 dark:bg-stone-800 text-stone-700 dark:text-stone-300 hover:bg-stone-300 dark:hover:bg-stone-700 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button onclick="scrollFeatured(220)" aria-label="Sağa Kaydır"
              class="p-1 rounded-lg bg-stone-200/70 dark:bg-stone-800 text-stone-700 dark:text-stone-300 hover:bg-stone-300 dark:hover:bg-stone-700 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <div id="featuredTrack" class="flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-1"></div>
      </section>

      <!-- Kategorilere Göre Menü Listesi -->
      <div id="menuContainer" class="space-y-8"></div>
    </main>
  </div>

  <!-- ÜRÜN DETAY SAYFASI -->
  <div id="productDetailView" class="hidden min-h-screen bg-stone-50 dark:bg-stone-950">
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-stone-900/95 backdrop-blur border-b border-stone-200 dark:border-stone-800">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <button onclick="closeProduct()"
          class="flex items-center gap-2 text-sm font-semibold text-stone-800 dark:text-stone-100 hover:text-amber-700 dark:hover:text-amber-400 transition py-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span>Menüye Dön</span>
        </button>

        <button onclick="toggleTheme()" aria-label="Tema Değiştir"
          class="p-2 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-amber-400 hover:bg-stone-200 dark:hover:bg-stone-700 transition">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="productDetailContent" class="max-w-3xl mx-auto px-4 pt-5 pb-12"></main>
  </div>

  <script>
    // BURAYA MEVCUT SUPABASE ANON KEY BİLGİNİZİ YAPIŞTIRIN
    const SUPABASE_URL = 'https://pmhqpdrhlyncwsyehuvl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtaHFwZHJobHluY3dzeWVodXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MTY3NTMsImV4cCI6MjExMTE5Mjc1M30.uJRs7wr232jW0sYVQUuXGkCeLcYFOqvBE5po7VyYpjs';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allProducts = [];
    let selectedCategory = 'TÜMÜ';
    let lastScrollY = 0;
    let navigatedFromMenu = false;

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('limcera-theme', isDark ? 'dark' : 'light');
    }

    function scrollFeatured(amount) {
      document.getElementById('featuredTrack').scrollBy({ left: amount, behavior: 'smooth' });
    }

    function normalizeTR(text) {
      if (!text) return '';
      return text
        .toLocaleLowerCase('tr-TR')
        .replace(/\u0307/g, '')
        .replace(/ı/g, 'i')
        .replace(/ğ/g, 'g')
        .replace(/ü/g, 'u')
        .replace(/ş/g, 's')
        .replace(/ö/g, 'o')
        .replace(/ç/g, 'c');
    }

    async function fetchMenu() {
      const { data, error } = await sb
        .from('urunler')
        .select('*')
        .eq('aktif_mi', true)
        .order('sira_no', { ascending: true })
        .order('id', { ascending: true });

      document.getElementById('loading').style.display = 'none';

      if (error) {
        document.getElementById('menuContainer').innerHTML =
          `<p class="text-red-500 text-center text-sm">Menü yüklenirken hata oluştu.</p>`;
        return;
      }

      allProducts = data || [];
      renderFeatured();
      renderCategories();
      renderMenu();
      handleInitialHash();
    }

    function renderFeatured() {
      const query = normalizeTR(document.getElementById('searchInput').value).trim();
      const bannerSection = document.getElementById('heroBannerSection');
      if (bannerSection && bannerSection.dataset.missing !== 'true') {
        if (query.length > 0) bannerSection.classList.add('hidden');
        else bannerSection.classList.remove('hidden');
      }

      const featured = allProducts.filter(p => p.onerilen_mi === true);
      const section = document.getElementById('featuredSection');
      const track = document.getElementById('featuredTrack');

      if (featured.length === 0 || query.length > 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      track.innerHTML = featured.map(item => `
        <div onclick="openProduct(${item.id})"
          class="w-44 sm:w-48 flex-shrink-0 snap-start cursor-pointer group bg-white dark:bg-stone-900 rounded-2xl overflow-hidden border border-stone-200/80 dark:border-stone-800 shadow-sm hover:border-amber-400 dark:hover:border-amber-600 transition">
          <div class="relative w-full h-28 bg-stone-100 dark:bg-stone-800 overflow-hidden flex items-center justify-center">
            ${item.gorsel_url
              ? `<img src="${item.gorsel_url}" alt="${item.ad}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />`
              : `<span class="text-xs font-bold text-stone-300 dark:text-stone-600">LİMCERA</span>`
            }
            <span class="absolute top-2 left-2 bg-amber-500 text-stone-950 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
              ★ Önerilen
            </span>
          </div>
          <div class="p-2.5">
            <div class="text-[10px] font-semibold text-stone-400 dark:text-stone-500 truncate">${item.kategori}</div>
            <h3 class="font-bold text-xs text-stone-900 dark:text-stone-100 truncate mt-0.5">${item.ad}</h3>
            <div class="mt-1.5 font-extrabold text-sm text-amber-700 dark:text-amber-400">
              ${Number(item.fiyat).toLocaleString('tr-TR')} ₺
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderCategories() {
      const categories = ['TÜMÜ', ...new Set(allProducts.map(p => p.kategori))];
      const tabsEl = document.getElementById('categoryTabs');
      tabsEl.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat}')"
          class="whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
            selectedCategory === cat
              ? 'bg-stone-900 dark:bg-amber-500 text-white dark:text-stone-950 shadow-sm'
              : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 hover:bg-stone-200 dark:hover:bg-stone-700'
          }">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      renderFeatured();
      const query = normalizeTR(document.getElementById('searchInput').value).trim();
      const filtered = allProducts.filter(p => {
        const matchesCat = selectedCategory === 'TÜMÜ' || p.kategori === selectedCategory;
        const matchesQuery =
          normalizeTR(p.ad).includes(query) ||
          (p.aciklama && normalizeTR(p.aciklama).includes(query));
        return matchesCat && matchesQuery;
      });

      const container = document.getElementById('menuContainer');
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-stone-500 dark:text-stone-400 py-10 text-sm">Aradığınız kriterde ürün bulunamadı.</p>`;
        return;
      }

      const grouped = filtered.reduce((acc, item) => {
        acc[item.kategori] = acc[item.kategori] || [];
        acc[item.kategori].push(item);
        return acc;
      }, {});

      container.innerHTML = Object.entries(grouped).map(([category, items]) => `
        <section>
          <h2 class="text-base font-bold text-stone-900 dark:text-stone-100 mb-3 pb-1.5 border-b border-stone-200 dark:border-stone-800 flex items-center justify-between">
            <span>${category}</span>
            <span class="text-xs font-normal text-stone-400 dark:text-stone-500">${items.length} ürün</span>
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            ${items.map(item => `
              <div onclick="openProduct(${item.id})"
                class="group cursor-pointer bg-white dark:bg-stone-900 rounded-2xl p-3 border border-stone-100 dark:border-stone-800 shadow-sm hover:border-amber-300 dark:hover:border-amber-700 active:scale-[0.99] transition flex gap-3.5 items-center">
                <div class="w-28 h-28 rounded-xl bg-stone-100 dark:bg-stone-800 flex-shrink-0 overflow-hidden flex items-center justify-center">
                  ${item.gorsel_url
                    ? `<img src="${item.gorsel_url}" alt="${item.ad}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />`
                    : `<span class="text-xs font-bold text-stone-300 dark:text-stone-600 text-center px-2">LİMCERA</span>`
                  }
                </div>
                <div class="flex-1 min-w-0">
                  <h3 class="font-semibold text-stone-900 dark:text-stone-100 text-sm leading-snug line-clamp-2">${item.ad}</h3>
                  ${item.aciklama ? `<p class="text-xs text-stone-500 dark:text-stone-400 mt-1 line-clamp-2">${item.aciklama}</p>` : ''}
                  <div class="mt-2.5 flex items-center justify-between">
                    <span class="font-bold text-amber-700 dark:text-amber-400 text-base">${Number(item.fiyat).toLocaleString('tr-TR')} ₺</span>
                    <span class="text-[11px] text-stone-400 dark:text-stone-500 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition">İncele →</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    function openProduct(id, pushHistory = true) {
      const item = allProducts.find(p => p.id === id);
      if (!item) return;

      if (pushHistory) {
        lastScrollY = window.scrollY;
        navigatedFromMenu = true;
        history.pushState({ productId: id }, '', `#urun-${id}`);
      }

      document.title = `${item.ad} | Trabzon Limcera`;

      const related = allProducts
        .filter(p => p.kategori === item.kategori && p.id !== item.id)
        .slice(0, 4);

      document.getElementById('productDetailContent').innerHTML = `
        <article class="bg-white dark:bg-stone-900 rounded-3xl overflow-hidden border border-stone-200/80 dark:border-stone-800 shadow-sm">
          <div class="w-full aspect-[4/3] sm:aspect-[16/10] bg-stone-100 dark:bg-stone-800 flex items-center justify-center overflow-hidden">
            ${item.gorsel_url
              ? `<img src="${item.gorsel_url}" alt="${item.ad}" class="w-full h-full object-cover" />`
              : `<div class="text-center p-6">
                   <div class="text-2xl font-bold tracking-widest text-stone-300 dark:text-stone-600">TRABZON LİMCERA</div>
                   <p class="text-xs text-stone-400 dark:text-stone-500 mt-1">Görsel hazırlanıyor</p>
                 </div>`
            }
          </div>

          <div class="p-6">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-bold uppercase tracking-wider bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 px-3 py-1 rounded-full">
                ${item.kategori}
              </span>
              <span class="text-xs text-stone-400 dark:text-stone-500">Fiyatlara KDV Dahildir</span>
            </div>

            <h1 class="text-2xl font-bold text-stone-900 dark:text-white mt-2 leading-tight">${item.ad}</h1>

            <div class="mt-3 text-2xl font-extrabold text-amber-700 dark:text-amber-400">
              ${Number(item.fiyat).toLocaleString('tr-TR')} ₺
            </div>

            ${item.aciklama
              ? `<div class="mt-4 pt-4 border-t border-stone-100 dark:border-stone-800">
                   <h2 class="text-xs font-semibold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-1.5">Ürün Açıklaması</h2>
                   <p class="text-sm text-stone-600 dark:text-stone-300 leading-relaxed">${item.aciklama}</p>
                 </div>`
              : ''
            }
          </div>
        </article>

        ${related.length > 0 ? `
          <section class="mt-8">
            <h2 class="text-sm font-bold text-stone-900 dark:text-stone-100 mb-3">Aynı Kategorideki Diğer Lezzetler</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${related.map(rel => `
                <div onclick="openProduct(${rel.id})"
                  class="cursor-pointer bg-white dark:bg-stone-900 rounded-2xl p-2.5 border border-stone-100 dark:border-stone-800 hover:border-amber-400 transition">
                  <div class="w-full aspect-square rounded-xl bg-stone-100 dark:bg-stone-800 overflow-hidden flex items-center justify-center mb-2">
                    ${rel.gorsel_url
                      ? `<img src="${rel.gorsel_url}" alt="${rel.ad}" loading="lazy" class="w-full h-full object-cover" />`
                      : `<span class="text-[10px] font-bold text-stone-300 dark:text-stone-600">LİMCERA</span>`
                    }
                  </div>
                  <div class="text-xs font-semibold text-stone-900 dark:text-stone-100 truncate">${rel.ad}</div>
                  <div class="text-xs font-bold text-amber-700 dark:text-amber-400 mt-0.5">${Number(rel.fiyat).toLocaleString('tr-TR')} ₺</div>
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}
      `;

      document.getElementById('menuView').classList.add('hidden');
      document.getElementById('productDetailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showMenuView() {
      document.title = 'Trabzon Limcera | Dijital Menü';
      document.getElementById('productDetailView').classList.add('hidden');
      document.getElementById('menuView').classList.remove('hidden');
      window.scrollTo(0, lastScrollY);
    }

    function closeProduct() {
      if (navigatedFromMenu) {
        navigatedFromMenu = false;
        history.back();
      } else {
        history.replaceState(null, '', window.location.pathname);
        showMenuView();
      }
    }

    function handleInitialHash() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#urun-')) {
        const id = parseInt(hash.replace('#urun-', ''), 10);
        if (!isNaN(id)) {
          openProduct(id, false);
          return;
        }
      }
      showMenuView();
    }

    window.addEventListener('popstate', handleInitialHash);
    document.getElementById('searchInput').addEventListener('input', renderMenu);
    fetchMenu();
  </script>
</body>
</html>
